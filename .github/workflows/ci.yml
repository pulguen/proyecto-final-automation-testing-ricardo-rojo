name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: reports/runs/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run API tests
        run: python -m pytest -v -m api

      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-api
          path: reports/runs/
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: reports/runs/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify Google Chrome
        run: google-chrome --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run UI tests
        run: python -m pytest -v -m ui --headless

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ui
          path: reports/runs/
          if-no-files-found: warn
          retention-days: 14
