[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = --strict-markers
log_file_mode = w
log_file_level = INFO
log_file_format = %(asctime)s - %(levelname)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
markers =
    ui: pruebas de interfaz con Selenium
    api: pruebas HTTP de la API JSONPlaceholder
html_report_title = Trabajo Final Integrador | Automation Testing
html_report_description = Framework de automatización de pruebas UI con Selenium y API con Requests, desarrollado en Python y Pytest. Incluye Page Object Model, parametrización JSON/CSV, reportes HTML, capturas de fallos e integración continua con GitHub Actions.
